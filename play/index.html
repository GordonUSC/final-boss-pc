<!doctype html>
<html lang="en">
<head>
<!-- STYLE: FINAL BOSS arcade boss fight, the game IS the page | WHY: a standalone link should open straight into the match on a desktop, full window at native resolution, no site chrome, brand palette only | ALT: the site's game section (gordonusc.github.io/final-boss-pc/) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<script>
  // one link for everyone: a saved Mobile choice goes to the Mobile edition's own play page (add ?pick to choose again)
  (function () { var ed = null; try { ed = localStorage.getItem('fbg-edition'); } catch (e) {}
    if (ed === 'mobile' && !/[?&]pick/.test(location.search)) location.replace('https://gordonusc.github.io/final-boss/play/'); })();
</script>
<style>
  :root { --bb: #0E0B16; --red: #E8173A; --gold: #FFC93C; --cream: #F6E7C8; }
  html, body { margin: 0; height: 100%; background: var(--bb); color: var(--cream); overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  body { font: 600 15px/1.4 'Chakra Petch', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; }
  #game > .fbg-root { height: 100%; }
  .boot, .nojs { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 24px max(16px, env(safe-area-inset-left)) max(24px, env(safe-area-inset-bottom)); background: var(--bb) url(poster.jpg) 70% 30% / cover no-repeat; }
  .boot h1, .nojs h1 { margin: 0; font: 900 clamp(34px, 9vw, 72px)/.9 'Archivo', 'Arial Black', sans-serif; font-stretch: 125%; transform: skewX(-8deg); text-shadow: 3px 3px 0 var(--red); max-width: 12ch; }
  .boot p, .nojs p { margin: 0; max-width: 36ch; background: var(--bb); padding: 8px 12px; box-shadow: inset 3px 0 0 var(--gold); }
  .home { position: fixed; z-index: 2147483001; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); color: var(--cream); background: var(--bb); text-decoration: none; font: 700 13px/1 'Chakra Petch', sans-serif; padding: 10px 14px 9px; min-height: 36px; display: inline-flex; align-items: center; box-shadow: inset 0 -2px 0 var(--red); clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  .home:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .home[hidden] { display: none; }
  /* the site chip never sits on a panel or a control: the open card reserves room above it, and the (inactive) touch controls hide while a card is open */
  body.chip-on #game .fbg-ov { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  body.chip-on #game .fbg-touch { visibility: hidden; }
</style>
<noscript><style>.boot { display: none; } .home { display: none; }</style></noscript>
</head>
<body>
<main id="game" aria-label="Boss Rush">
  <noscript><div class="nojs"><h1>BOSS RUSH</h1>
    <p>Turn on JavaScript to play Boss Rush, the FINAL BOSS dodgeball game.</p>
    <p>Sin City style: 8 on 8, five balls, no sting. Rush only the balls on your right, clear your attack line, then throw. Catch a throw and the thrower is out while your next teammate comes back in. 3 or more balls on your side, held or loose, starts a 15 second clock. Drop to 2 and it resets. At 0, all 5 balls go over: 3, 2, 1, then every ball goes to the other side.</p>
    <p>Also playable: the <a href="https://gordonusc.github.io/final-boss/play/" style="color:var(--gold)">Mobile edition</a>. The team file is at <a href="../" style="color:var(--gold)">the FINAL BOSS site</a>.</p></div></noscript>
  <div class="boot" id="boot"><h1>BOSS RUSH</h1><p id="boot-p">Loading the arena...</p></div>
</main>
<a class="home" id="home" href="../">FINAL BOSS site</a>
<script>
(function () {
  var boot = document.getElementById('boot'), home = document.getElementById('home'), mount = document.getElementById('game');
  var s = document.createElement('script'); s.src = '../game/game.bundle.js?v=pc-fu-20261027';
  var fail = function (msg) { document.getElementById('boot-p').textContent = msg; };
  var t = setTimeout(function () { if (!window.FBGame) fail('The arena is taking a while. Check your connection, then reload.'); }, 12000);
  s.onerror = function () { clearTimeout(t); fail('The arena could not load. Reload to try again.'); };
  s.onload = function () {
    clearTimeout(t);
    if (!window.FBGame) return fail('The arena could not start on this browser.');
    boot.remove();
    window.FBGame.mount(mount, { edition: 'pc', native: true, fill: true, picker: /[?&]pick/.test(location.search) ? 'always' : undefined });
    // the site link shows on the picker, title and results, never over a live match
    // the site chip shows only on the title, picker, results and pause cards; during play it is gone, unfocusable and click-through, so a
    // Shift+click (PASS + THROW) can never open the site in a new window
    var syncHome = function () { var st = window.FBGame.state(); var off = !!(st && st.phase && !/title|result/.test(st.phase) && !st.paused);
      home.hidden = off; home.tabIndex = off ? -1 : 0; home.setAttribute('aria-hidden', off ? 'true' : 'false'); home.style.pointerEvents = off ? 'none' : ''; document.body.classList.toggle('chip-on', !off); };
    // and the chip itself refuses any click that could open a window: a held modifier, a non-left button, or any phase that is not a menu
    var guardHome = function (e) { var st = window.FBGame.state(); var menu = !st || !st.phase || /title|result|unavailable/.test(st.phase) || st.paused;
      if (!menu || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey || e.button !== 0) { e.preventDefault(); e.stopPropagation(); } };
    home.addEventListener('click', guardHome, true); home.addEventListener('auxclick', guardHome, true);
    setInterval(syncHome, 200); document.addEventListener('pointerdown', syncHome, true); document.addEventListener('keydown', syncHome, true);
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
